project:
  type: website
  output-dir: docs

# Meta
description-meta: "Ph.D. Candidate in Statistics"
author-meta: "Kihyun Han"

website:
  title: "Kihyun Han"
  image: "files/images/profile_pic.jpg"
  description: "Ph.D. Candidate in Statistics"

  navbar:
    background: light  # You can change the background color here
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: publications.qmd
      - text: Teaching
        href: teaching.qmd
    right:
      - text: CV
        href: files/cv.pdf
      - icon: github
        href: https://github.com/khnhan
        target: _blank

  page-navigation: true

  page-footer:
    left: "[Kihyun Han](https://khnhan.github.io) &copy; <script>document.write(new Date().getFullYear())</script>"
    center: "Built on the [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) by [Dr. Gang He](http://drganghe.github.io)"
    right:
      - icon: github
        href: https://github.com/khnhan
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true
  draft-mode: unlinked

  repo-url: https://github.com/khnhan/khnhan.github.io
#  repo-actions: [edit, issue, source]

  open-graph: true
  twitter-card: true
#  card-style: summary

  site-url: "https://khnhan.github.io"

# bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/khnhan\.github\.io'
    include-in-header: "files/includes/_academic.qmd"